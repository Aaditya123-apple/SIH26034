apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: legal-metrology-data
  namespace: legal-metrology
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: legal-metrology-backend
  namespace: legal-metrology
spec:
  replicas: 1
  selector:
    matchLabels:
      app: legal-metrology-backend
  template:
    metadata:
      labels:
        app: legal-metrology-backend
    spec:
      containers:
        - name: backend
          image: your-registry/legal-metrology-backend:latest
          ports:
            - containerPort: 8000
          env:
            - name: CORS_ALLOWED_ORIGINS
              value: https://your-domain.example
            - name: DB_PATH
              value: /app/backend/data/inspections.db
            - name: OCR_PROVIDER
              value: demo
            - name: DETECTION_PROVIDER
              value: demo
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: legal-metrology-data
---
apiVersion: v1
kind: Service
metadata:
  name: legal-metrology-backend
  namespace: legal-metrology
spec:
  selector:
    app: legal-metrology-backend
  ports:
    - port: 8000
      targetPort: 8000
