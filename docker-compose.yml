services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DB_PATH: /app/backend/data/inspections.db
      OCR_PROVIDER: demo
      DETECTION_PROVIDER: demo
    volumes:
      - backend-data:/app/backend/data

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  backend-data:
